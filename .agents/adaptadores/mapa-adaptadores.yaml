papeis:
  explorador:
    fonte: .agents/papeis/explorador.md
    classe_execucao: leitor
    acesso_padrao: somente-leitura
    adaptadores:
      - ferramenta: claude-code
        caminho: .claude/agents/explorador.md
        formato: markdown+yaml-frontmatter
        status: ativo-sem-smoke-test
        documentacao_oficial: https://docs.anthropic.com/en/docs/claude-code/sub-agents
        versao_local: 2.1.200
        descoberta_validada: true
        permissao_validada: true
        delegacao: proibida
        delegacao_validada: true
        garantia_tecnica: omitindo Agent e usando disallowedTools
        herda_modelo: true
        limitacoes:
          - sem Bash neste adaptador
      - ferramenta: codex
        caminho: .codex/agents/explorador.toml
        formato: toml
        status: ativo-sem-smoke-test
        documentacao_oficial: https://developers.openai.com/codex/agent-configuration/subagents.md
        versao_local: 0.144.0
        descoberta_validada: true
        permissao_validada: true
        delegacao: proibida
        delegacao_validada: true
        garantia_tecnica: agents.max_depth=1 + sem configuracao de spawn neste papel
        herda_modelo: true
        limitacoes:
          - sessao principal ainda influencia approvals
      - ferramenta: cursor
        caminho: .cursor/agents/explorador.md
        formato: markdown+yaml-frontmatter
        status: ativo-sem-smoke-test
        documentacao_oficial: https://cursor.com/docs/subagents
        versao_local: nao-detectada-via-cli
        descoberta_validada: false
        permissao_validada: parcialmente
        delegacao: proibida-por-contrato
        delegacao_validada: false
        garantia_tecnica: nao comprovada localmente
        herda_modelo: true
        limitacoes:
          - readonly documentado, sem smoke local
      - ferramenta: cline-ide
        caminho: null
        formato: subagente-experimental-nativo
        status: parcial-por-superficie
        documentacao_oficial: https://docs.cline.bot/features/subagents.md
        versao_local: 3.0.39
        descoberta_validada: false
        permissao_validada: true
        delegacao: proibida
        delegacao_validada: true
        garantia_tecnica: documentada pela superficie IDE
        herda_modelo: nao-conclusivo
        limitacoes:
          - sem browser, sem MCP, sem edicao
      - ferramenta: cline-cli-sdk-kanban
        caminho: null
        formato: teams-ou-agents
        status: suporte-documentado-nao-validado-localmente
        documentacao_oficial: https://docs.cline.bot/cli/agent-teams.md
        versao_local: 3.0.39
        descoberta_validada: false
        permissao_validada: false
        delegacao: depende-da-superficie
        delegacao_validada: false
        garantia_tecnica: nao comprovada nesta rodada
        herda_modelo: nao-conclusivo
        limitacoes:
          - arquivos .cline/agents nao materializados nesta PR
      - ferramenta: opencode
        caminho: .opencode/agents/explorador.md
        formato: markdown+yaml-frontmatter
        status: ativo-sem-smoke-test
        documentacao_oficial: https://opencode.ai/docs/agents
        versao_local: 1.17.18
        descoberta_validada: false
        permissao_validada: true
        delegacao: proibida
