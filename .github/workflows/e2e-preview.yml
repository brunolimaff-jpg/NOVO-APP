---
name: E2E Preview Vercel

on: # yamllint disable-line rule:truthy
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL do deploy preview (ex: https://novo-app-git-branch.vercel.app)'
        required: true
        type: string
      pr_number:
        description: Número do PR para comentário em caso de falha (opcional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e-preview-critical-ux:
    name: E2E Preview Vercel (painel, cofre, Scheffer)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'Preview'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}

      - name: Resolver preview URL
        id: resolve_url
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PREVIEW_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail

          PREVIEW_URL=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PREVIEW_URL="$DISPATCH_PREVIEW_URL"
          elif [[ "$EVENT_NAME" == "deployment_status" ]]; then
            PREVIEW_URL="${DEPLOYMENT_ENVIRONMENT_URL:-${DEPLOYMENT_TARGET_URL:-}}"
          fi

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ -z "$PREVIEW_URL" ]]; then
            echo "Não foi possível resolver BASE_URL para o evento '$EVENT_NAME'." >&2
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Usando BASE_URL=$PREVIEW_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: E2E critical-ux contra preview Vercel
        env:
          BASE_URL: ${{ steps.resolve_url.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run test:e2e:preview

      - name: Comentar falha no PR (deployment_status)
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ E2E Preview Vercel falhou (painel, cofre, Scheffer).\n\nMerge bloqueado até este check ficar verde.\n\n🔗 Logs: ${runUrl}`;

            const prs = context.payload.deployment?.pull_requests || [];
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Comentar falha no PR (manual)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ E2E Preview Vercel falhou na execução manual.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
