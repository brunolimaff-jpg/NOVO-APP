---
name: E2E Preview Vercel

# Opcional (manual). Não é gate de merge — PR Gate IA no preview substitui blocking E2E.
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL do deploy preview (ex: https://novo-app-git-branch.vercel.app)'
        required: true
        type: string
      pr_number:
        description: Número do PR para comentário em caso de falha (opcional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e-preview-critical-ux:
    name: E2E Preview Vercel (painel, cofre, Scheffer)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver preview URL
        id: resolve_url
        shell: bash
        env:
          DISPATCH_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail

          PREVIEW_URL="${DISPATCH_PREVIEW_URL%/}"

          if [[ -z "$PREVIEW_URL" ]]; then
            echo "preview_url é obrigatório em workflow_dispatch." >&2
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Usando BASE_URL=$PREVIEW_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: E2E critical-ux contra preview Vercel
        env:
          BASE_URL: ${{ steps.resolve_url.outputs.preview_url }}
          E2E_REAL_AUTH: '1'
          E2E_OPERATOR_EMAIL: ${{ secrets.GOLDEN_E2E_OPERATOR_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.GOLDEN_E2E_AUTH_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run test:e2e:preview

      - name: Comentar falha no PR (manual)
        if: failure() && inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ E2E Preview Vercel falhou na execução manual.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
