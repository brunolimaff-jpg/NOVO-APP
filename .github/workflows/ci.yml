---
name: CI

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run typecheck
        run: npm run typecheck

  dossier-golden:
    name: Dossier Golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:dossier

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Shell hook tests
        run: bash tests/scripts/completion-check.test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e-critical-browser:
    name: E2E Critical Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run critical browser regressions
        run: npm run test:e2e:critical-ux

  skills-governance:
    name: Skills Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'
      - name: Validate skills governance
        run: ruby scripts/validate-skills-governance.rb
      - name: Run negative tests for skills governance
        run: ruby scripts/test-validate-skills-governance.rb

  agent-orchestration:
    name: Agent Orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.7'
      - name: Validate agent orchestration
        run: ruby scripts/validate-agent-orchestration.rb
      - name: Run orchestration tests
        run: ruby scripts/test-agent-orchestration.rb
      - name: Validate Codex harness policy
        run: ruby scripts/validate-codex-harness-policy.rb
      - name: Run Codex harness policy tests
        run: ruby scripts/test-codex-harness-policy.rb

  agent-execution-control:
    name: Agent Execution Control
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3.7'
      - name: Validate agent execution control
        run: ruby scripts/validate-agent-execution.rb
      - name: Run execution control tests
        run: ruby scripts/test-agent-execution.rb
      - name: Run single-agent runtime tests
        run: ruby scripts/test-agent-runtime.rb

  agent-runtime-observation:
    name: Agent Runtime Observation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3.7'
      - name: Validate agent observation contracts
        run: ruby scripts/validate-agent-observation.rb
      - name: Run observation and supervised-pilot tests
        run: ruby scripts/test-agent-observation.rb
      - name: Run forensic evidence tests
        run: ruby scripts/test-agent-forensic-evidence.rb

  runtime-safety-preflight:
    name: Runtime Safety Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3.7'
      - name: Validate runtime safety (static + fixtures)
        run: ruby scripts/validate-runtime-safety.rb
      - name: Run runtime safety tests
        run: ruby scripts/test-runtime-safety.rb
      - name: Run DCG live readiness tests
        run: ruby scripts/test-dcg-live-readiness.rb
