---
name: CI
permissions:
  contents: read
  security-events: write

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run typecheck
        run: npm run typecheck

  dossier-golden:
    name: Dossier Golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dossier

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Shell hook tests
        run: bash tests/scripts/completion-check.test.sh

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check bundle size budget
        run: npm run check:budget

  e2e-critical-browser:
    name: E2E Critical Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run critical browser regressions
        run: >-
          npx playwright test
          tests-e2e/blank-center-panel-regression.spec.ts
          tests-e2e/controlled-error-state.spec.ts
          tests-e2e/loading-smart-recovery.spec.ts
          tests-e2e/smoke.chat-shell.spec.ts
          tests-e2e/smoke.hydration-post-reload.spec.ts

  e2e-cnpj-flow:
    name: E2E CNPJ Flow
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run CNPJ investigation flow
        run: >-
          npx playwright test
          tests-e2e/cnpj-investigation-flow.spec.ts
          tests-e2e/scheffer-cnpj-blank-panel.spec.ts
