---
name: Preview Smoke
# Smoke HTTP de rotas — Gemini real no preview é follow-up (PR Gate IA / critical-ux)

on: # yamllint disable-line rule:truthy
  deployment_status:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL do deploy preview (ex: https://my-app-git-branch.vercel.app)'
        required: true
        type: string
      pr_number:
        description: Número do PR para comentário em caso de falha (opcional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    name: Smoke (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/smoke'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver preview URL
        id: resolve_url
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          PREVIEW_URL=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PREVIEW_URL="${{ inputs.preview_url }}"
          elif [[ "$EVENT_NAME" == "deployment_status" ]]; then
            PREVIEW_URL="${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}"
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            BODY="${{ github.event.comment.body }}"
            PREVIEW_URL=$(echo "$BODY" | grep -Eo 'https?://[^[:space:]]+' | head -n1 || true)
          fi

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ -z "$PREVIEW_URL" ]]; then
            echo "Não foi possível resolver PREVIEW_URL para o evento '$EVENT_NAME'." >&2
            echo "Em comentário, use: /smoke https://seu-preview.vercel.app" >&2
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Usando PREVIEW_URL=$PREVIEW_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar smoke
        env:
          PREVIEW_URL: ${{ steps.resolve_url.outputs.preview_url }}
          SMOKE_ROUTES: /,/login,/dashboard
          SMOKE_TIMEOUT_MS: 15000
          SMOKE_ALLOW_PROTECTED_SKIP: ${{ github.event_name == 'deployment_status' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET == '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-preview.mjs

      - name: Comentar falha no PR
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para o preview informado.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comentar falha no PR (deployment_status)
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou após deploy preview.\n\n🔗 Logs: ${runUrl}`;

            const prs = context.payload.deployment?.pull_requests || [];
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Comentar falha no PR (manual)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para execução manual.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body,
            });
