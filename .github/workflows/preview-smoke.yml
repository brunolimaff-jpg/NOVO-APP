---
name: Preview Smoke

on: # yamllint disable-line rule:truthy
  deployment_status:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL do deploy preview (ex: https://my-app-git-branch.vercel.app)'
        required: true
        type: string
      pr_number:
        description: Número do PR para comentário em caso de falha (opcional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    name: Smoke (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/smoke ') &&
       contains(
         fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
         github.event.comment.author_association
       ))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolver preview URL
        id: resolve_url
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const eventName = process.env.EVENT_NAME;
          let rawValue = '';

          if (eventName === 'workflow_dispatch') {
            rawValue = process.env.INPUT_PREVIEW_URL ?? '';
          } else if (eventName === 'deployment_status') {
            rawValue = process.env.DEPLOYMENT_ENVIRONMENT_URL || process.env.DEPLOYMENT_TARGET_URL || '';
          } else if (eventName === 'issue_comment') {
            const lines = (process.env.COMMENT_BODY ?? '').split(/\r?\n/);
            if (lines.length !== 1 || !lines[0].startsWith('/smoke ')) {
              throw new Error('Comentário de smoke inválido.');
            }
            rawValue = lines[0].slice('/smoke '.length);
            if (!rawValue || /\s/.test(rawValue)) {
              throw new Error('Comentário de smoke deve conter somente uma URL.');
            }
          } else {
            throw new Error('Evento de smoke não suportado.');
          }

          const url = new URL(rawValue);
          const allowedHost = /^scoutagro(?:-[a-z0-9]+(?:-[a-z0-9]+)*)?-brunolimaff-3629s-projects\.vercel\.app$/;
          const valid =
            url.protocol === 'https:' &&
            !url.username &&
            !url.password &&
            !url.port &&
            url.pathname === '/' &&
            !url.search &&
            !url.hash &&
            allowedHost.test(url.hostname);

          if (!valid) {
            throw new Error('URL de Preview não permitida.');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `preview_url=${url.origin}\n`);
          console.log('Preview validado.');
          NODE

      - name: Executar smoke
        env:
          PREVIEW_URL: ${{ steps.resolve_url.outputs.preview_url }}
          SMOKE_ROUTES: /,/login,/dashboard
          SMOKE_TIMEOUT_MS: 15000
          SMOKE_ALLOW_PROTECTED_SKIP: ${{ github.event_name == 'deployment_status' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET == '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-preview.mjs

      - name: Comentar falha no PR
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para o preview informado.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comentar falha no PR (deployment_status)
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou após deploy preview.\n\n🔗 Logs: ${runUrl}`;

            const prs = context.payload.deployment?.pull_requests || [];
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Comentar falha no PR (manual)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const rawPrNumber = process.env.PR_NUMBER ?? '';
            if (!/^[1-9]\d*$/.test(rawPrNumber)) {
              throw new Error('pr_number deve ser um inteiro positivo.');
            }

            const prNumber = Number(rawPrNumber);
            if (!Number.isSafeInteger(prNumber)) {
              throw new Error('pr_number fora do intervalo permitido.');
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para execução manual.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
