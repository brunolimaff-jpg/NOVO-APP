---
name: Preview Smoke

on: # yamllint disable-line rule:truthy
  deployment_status:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'URL do deploy preview (ex: https://my-app-git-branch.vercel.app)'
        required: true
        type: string
      pr_number:
        description: Número do PR para comentário em caso de falha (opcional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    name: Smoke (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/smoke') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver preview URL
        id: resolve_url
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          PREVIEW_URL=""

          case "$EVENT_NAME" in
            workflow_dispatch)
              PREVIEW_URL="$INPUT_PREVIEW_URL"
              ;;
            deployment_status)
              PREVIEW_URL="$DEPLOYMENT_PREVIEW_URL"
              ;;
            issue_comment)
              PREVIEW_URL=$(printf '%s\n' "$COMMENT_BODY" | grep -Eo 'https?://[^[:space:]]+' | head -n1 || true)
              ;;
            *)
              echo "Evento não suportado: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ -z "$PREVIEW_URL" ]]; then
            echo "Não foi possível resolver PREVIEW_URL para o evento '$EVENT_NAME'." >&2
            echo "Em comentário, use: /smoke https://seu-preview.vercel.app" >&2
            exit 1
          fi

          PREVIEW_URL_RE='^https://scoutagro-([a-z0-9]+(-[a-z0-9]+)*-)?brunolimaff-3629s-projects\.vercel\.app$'
          if [[ ! "$PREVIEW_URL" =~ $PREVIEW_URL_RE ]]; then
            echo "PREVIEW_URL não pertence aos previews Vercel deste projeto." >&2
            exit 1
          fi

          printf 'preview_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Usando PREVIEW_URL=$PREVIEW_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar smoke
        env:
          PREVIEW_URL: ${{ steps.resolve_url.outputs.preview_url }}
          SMOKE_ROUTES: /,/login,/dashboard
          SMOKE_TIMEOUT_MS: 15000
          SMOKE_ALLOW_PROTECTED_SKIP: ${{ github.event_name == 'deployment_status' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET == '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-preview.mjs

      - name: Comentar falha no PR
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para o preview informado.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comentar falha no PR (deployment_status)
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou após deploy preview.\n\n🔗 Logs: ${runUrl}`;

            const prs = context.payload.deployment?.pull_requests || [];
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Comentar falha no PR (manual)
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const rawPrNumber = process.env.PR_NUMBER ?? '';
            if (!/^[1-9]\d*$/.test(rawPrNumber)) {
              throw new Error('pr_number deve ser um inteiro positivo.');
            }

            const prNumber = Number(rawPrNumber);
            if (!Number.isSafeInteger(prNumber)) {
              throw new Error('pr_number fora do intervalo permitido.');
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ Smoke test falhou para execução manual.\n\n🔗 Logs: ${runUrl}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
